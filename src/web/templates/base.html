<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExpenseTracker{% block title %}{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="sidebar-brand">
        <img src="/static/favicon.svg" alt="" width="24" height="24">
        <span class="brand-text">ExpenseTracker</span>
      </div>
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu" aria-expanded="false">☰</button>
    </header>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="/static/favicon.svg" alt="" width="26" height="26">
        <h1>ExpenseTracker</h1>
      </div>
      <a class="nav-link {{ 'active' if active_page == 'run' else '' }}" href="/run">▶ Run</a>
      <a class="nav-link {{ 'active' if active_page == 'config' else '' }}" href="/config">⚙ Config</a>
      <a class="nav-link {{ 'active' if active_page == 'status' else '' }}" href="/status">● Status</a>
      <div class="nav-group">Database</div>
      <a class="nav-link {{ 'active' if active_page == 'db_vendors' else '' }}" href="/db/vendors">Vendors</a>
      <a class="nav-link {{ 'active' if active_page == 'db_rules' else '' }}" href="/db/rules">Rules</a>
      <a class="nav-link {{ 'active' if active_page == 'db_test' else '' }}" href="/db/test">Test</a>
      <a class="nav-link {{ 'active' if active_page == 'db_history' else '' }}" href="/db/history">History</a>
    </nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    const sidebarEl = document.getElementById("sidebar");
    const backdropEl = document.getElementById("sidebar-backdrop");
    const toggleEl = document.getElementById("menu-toggle");

    function closeSidebar() {
      sidebarEl.classList.remove("open");
      toggleEl.setAttribute("aria-expanded", "false");
    }

    toggleEl.addEventListener("click", () => {
      const open = sidebarEl.classList.toggle("open");
      toggleEl.setAttribute("aria-expanded", String(open));
    });
    backdropEl.addEventListener("click", closeSidebar);
  </script>
</body>
</html>
